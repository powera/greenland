# Wikipedia's Level 4 Physical sciences list, as of the August 2026 revision.
# Physics, chemistry, astronomy and earth science.  wiki_biology covers
#
# 1111 titles in 122 groups, resolved against the
# enwiki-20220501 snapshot: a title renamed since then is stored under its
# 2022 spelling so wiki_dump can find it by exact title.
#
# 7 titles were redirects in 2022 and are stored
# under the target they redirect to:
#   Cosmic inflation  ->  Inflation (cosmology)
#   History of atomic theory  ->  Atomic theory
#   Late Devonian mass extinction  ->  Late Devonian extinction
#   Organophosphorus chemistry  ->  Organophosphorus compound
#   Organosilicon chemistry  ->  Organosilicon compound
#   Organosulfur chemistry  ->  Organosulfur compounds
#   Propylene  ->  Propene
#
# 6 titles have no snapshot article under any
# spelling tried, and are dropped:
#   Barycenter (astronomy)
#   Internal structure of Earth
#   Rutherford scattering experiments
#   Substance (chemistry)
#   Triassic–Jurassic extinction
#   pH

