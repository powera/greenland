# Wikipedia's Level 4 Mathematics list.
# A strict superset of the Level 3 list's 53-title Mathematics section,
# reaching the topics a general encyclopedia sample never gets to.  This is what
# registers mathematical English as ordinary vocabulary rather than as the tail
# of a general corpus.
#
# 299 titles in 7 groups, resolved against the
# enwiki-20220501 snapshot: a title renamed since then is stored under its
# 2022 spelling so wiki_dump can find it by exact title.

