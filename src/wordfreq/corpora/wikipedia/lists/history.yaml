# Wikipedia's Level 4 History list, as of the August 2026 revision.
# Periods, empires, wars and movements, from prehistory to the present.  Its
# distinctive vocabulary is heavily proper nouns and period terms; the ordinary
# English around them -- treaty, siege, dynasty, reign, revolt -- is what the
# corpus is for.
#
# 687 titles in 69 groups, resolved against the
# enwiki-20220501 snapshot: a title renamed since then is stored under its
# 2022 spelling so wiki_dump can find it by exact title.
#
# 19 titles were redirects in 2022 and are stored
# under the target they redirect to:
#   2008 financial crisis  ->  Financial crisis of 2007–2008
#   An Lushan rebellion  ->  An Lushan Rebellion
#   Ancient Israel and Judah  ->  History of ancient Israel and Judah
#   Anglo-Dutch wars  ->  Anglo-Dutch Wars
#   Asante Empire  ->  Ashanti Empire
#   Grand Principality of Moscow  ->  Grand Duchy of Moscow
#   History of philosophy  ->  Philosophy
#   Imjin War  ->  Japanese invasions of Korea (1592–1598)
#   Indo-Scythian Kingdom  ->  Indo-Scythians
#   Modern era  ->  Human history
#   Mongol conquests  ->  Mongol invasions and conquests
#   Mutapa Empire  ->  Kingdom of Mutapa
#   Peopling of the Americas  ->  Settlement of the Americas
#   Reform and opening up  ->  Chinese economic reform
#   Roman–Persian wars  ->  Roman–Persian Wars
#   Rurikids  ->  Rurik dynasty
#   Russian Revolution of 1905  ->  1905 Russian Revolution
#   Sri Lankan civil war  ->  Sri Lankan Civil War
#   Wall Street crash of 1929  ->  Wall Street Crash of 1929
#
# 7 titles have no snapshot article under any
# spelling tried, and are dropped:
#   Afghan conflict
#   Balkan Front (World War I)
#   Caral–Supe civilization
#   Mississippian period (archaeology)
#   Old Chosŏn
#   Polish–Russian War (1609–1618)
#   Umayyad state of Córdoba

