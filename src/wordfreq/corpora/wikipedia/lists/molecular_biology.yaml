# The molecular half of Wikipedia's Level 4 Biology and health sciences list, as of the August 2026 revision.
# Biochemistry, cell biology, physiology, ecology and general biology.  The
# Anatomy and Organisms sections of the same page build wiki_biology and are
# excluded here; the Health, medicine and disease section is excluded from both,
# being the technical register of named drugs, syndromes and procedures rather
# than ordinary English.
#
# 206 titles in 19 groups, resolved against the
# enwiki-20220501 snapshot: a title renamed since then is stored under its
# 2022 spelling so wiki_dump can find it by exact title.
#
# 3 titles were redirects in 2022 and are stored
# under the target they redirect to:
#   Biological sex  ->  Sex
#   Mitochondria  ->  Mitochondrion
#   Population (biology)  ->  Population
#
# 2 titles have no snapshot article under any
# spelling tried, and are dropped:
#   Domain (taxonomy)
#   Kingdom (taxonomy)

