# Wikipedia's Level 4 Arts list, as of the August 2026 revision.
# Architecture, literature, music, the performing and visual arts, film and
# television.  The critical metalanguage here -- narrative, genre, motif,
# counterpoint, chiaroscuro, choreography -- is what the book corpora do not
# supply: they *are* literature, and narrative English is not the vocabulary
# used to write *about* literature.
#
# 703 titles in 66 groups, resolved against the
# enwiki-20220501 snapshot: a title renamed since then is stored under its
# 2022 spelling so wiki_dump can find it by exact title.
#
# 11 titles were redirects in 2022 and are stored
# under the target they redirect to:
#   Al-Jabr  ->  The Compendious Book on Calculation by Completion and Balancing
#   Dark humor  ->  Black comedy
#   Hip-hop  ->  Hip hop
#   Hip-hop dance  ->  Hip hop dance
#   Non-fiction  ->  Nonfiction
#   On the Consolation of Philosophy  ->  The Consolation of Philosophy
#   Peter Pan (character)  ->  Peter Pan
#   Song of Roland  ->  The Song of Roland
#   Sun Wukong  ->  Monkey King
#   Symbolism (movement)  ->  Symbolism (arts)
#   Visual arts of the Indigenous peoples of the Americas  ->  Visual arts by indigenous peoples of the Americas
#
# Dropped by lists/redactions.yaml (see that file for why):
#   Kādambarī

