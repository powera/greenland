# Wikipedia's Level 4 People list, as of the August 2026 revision.
# Biographies in sixteen categories.  Overwhelmingly proper nouns, which
# analyze_book separates per document, so what the corpus contributes is the
# connective prose of biography rather than the names themselves.
#
# 1919 titles in 283 groups, resolved against the
# enwiki-20220501 snapshot: a title renamed since then is stored under its
# 2022 spelling so wiki_dump can find it by exact title.
#
# 32 titles were redirects in 2022 and are stored
# under the target they redirect to:
#   Abd Allah al-Mahdi Billah  ->  Abdallah al-Mahdi Billah
#   Al-Khwarizmi  ->  Muhammad ibn Musa al-Khwarizmi
#   B. B. King  ->  B.B. King
#   Baybars  ->  Baibars
#   Clement of Rome  ->  Pope Clement I
#   Edward I  ->  Edward I of England
#   Edward III  ->  Edward III of England
#   Franz Joseph I  ->  Franz Joseph I of Austria
#   Frederick Barbarossa  ->  Frederick I, Holy Roman Emperor
#   Hulegu Khan  ->  Hulagu Khan
#   Hürrem Sultan  ->  Hurrem Sultan
#   Ibn Taymiyya  ->  Ibn Taymiyyah
#   James McNeill Whistler  ->  James Abbott McNeill Whistler
#   Jean Le Rond d'Alembert  ->  Jean le Rond d'Alembert
#   Kim Il Sung  ->  Kim Il-sung
#   Lord Kelvin  ->  William Thomson, 1st Baron Kelvin
#   Lumière brothers  ->  Auguste and Louis Lumière
#   Mary I  ->  Mary I of England
#   Mehmed II  ->  Mehmed the Conqueror
#   Mohammad Zahir Shah  ->  Mohammed Zahir Shah
#   Nicholas II  ->  Nicholas II of Russia
#   Padmasambhava  ->  Padmasambhāva
#   Park Chung Hee  ->  Park Chung-hee
#   Philipp Melanchthon  ->  Philip Melanchthon
#   Ramkhamhaeng  ->  Ram Khamhaeng
#   Robert Millikan  ->  Robert Andrews Millikan
#   Syama Sastri  ->  Shyama Shastri
#   The Buddha  ->  Gautama Buddha
#   Tughril I  ->  Tughril
#   Vytautas the Great  ->  Vytautas
#   Wilhelm I  ->  William I, German Emperor
#   Wilhelm II  ->  Wilhelm II, German Emperor
#
# 7 titles have no snapshot article under any
# spelling tried, and are dropped:
#   Draco (legislator)
#   Fuzuli (poet)
#   Isma'il Pasha of Egypt
#   Kaṇāda
