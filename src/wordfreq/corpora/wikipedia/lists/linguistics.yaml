# Wikipedia's Level 5 Language list, as of the August 2026 revision.
# Linguistics and its metalanguage: grammar, phonetics, punctuation, spelling,
# semantics, sociolinguistics, the writing systems, the language families, and
# the individual languages.
#
# Level 5 rather than Level 4 because Level 4's Language branch is 197 titles
# and mostly names languages, while the vocabulary a learner needs -- morpheme,
# declension, diacritic, allophone, serial comma -- is concentrated in the
# Level 5 expansion.  Those 197 titles are a near-subset of these and were
# removed from lists/society.yaml when this list was added, so the two corpora
# share no article and a word can be exclusive to one of them.
#
# 602 titles in 48 groups, resolved against the
# enwiki-20220501 snapshot: a title renamed since then is stored under its
# 2022 spelling so wiki_dump can find it by exact title.
#
# 4 titles were renamed after 2022 and are stored
# under their snapshot spelling:
#   Degrees of comparison of adjectives and adverbs  ->  Comparison (grammar)
#   Mon-Burmese script  ->  Burmese alphabet
#   Personal pronouns in English  ->  English personal pronouns
#   Twi-Fante language  ->  Akan language
#
# 9 titles were redirects in 2022 and are stored
# under the target they redirect to:
#   Adposition  ->  Preposition and postposition
#   Central Kurdish  ->  Sorani
#   Eskaleut languages  ->  Eskimo-Aleut languages
#   Jawi script  ->  Jawi alphabet
#   Kurdish language  ->  Kurdish languages
#   Mapudungun  ->  Mapuche language
#   Middle dot  ->  Interpunct
#   Neo-Latin  ->  New Latin
#   Northern Sámi  ->  Northern Sami
#
# 6 titles resolve to a real article that the wikitext parser currently
# reduces to zero prose, so the build skips them:
#   Bulgarian language, Esperanto, Modern Hebrew, Norwegian language,
#   Pashto, Sundanese language
# Each one's {{Infobox language}} carries one more '}}' than '{{' -- the
# Col-begin/Col-2/Col-end legend in the speaker-distribution map -- and
# wiki_text's template matcher takes the surplus closer as the end of the
# infobox, then treats the article body as template argument.  These are
# kept in the list rather than dropped: the titles are right, and a parser
# that tolerated the surplus would pick them up with no change here.  Only
# language articles carry that infobox, which is why no other corpus hits it.
#
# 4 further titles are real but too short for --min-chars: Hypocorism,
# Assimilation (phonology), Luba-Katanga language, and the Swahili
# disambiguation stub.  So 592 of the 602 reach the corpus.
#
# "Mr." is kept: it is an article about the honorific as a lexical item,
# which is on-topic here.

