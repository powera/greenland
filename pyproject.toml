[project]
name = "greenland"
version = "0.1.0"
description = "A benchmark suite for language models"
authors = [
    {name = "Greenland Authors", email = "greenland@earlyversion.com"}
]
dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
]
requires-python = ">=3.9"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
# Core audio/TTS dependencies for audioshoe module
audioshoe = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "pydub>=0.25.0",
]
# Extended ML dependencies (includes audioshoe + more)
ml = [
    "greenland[audioshoe]",
    "transformers>=4.35.0",
    "whisper>=1.0",
    "accelerate>=0.25.0",
    "datasets>=2.14.0",
    "tiktoken>=0.5.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

# Tests directory: opt out of requiring type annotations
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false

# Benchmarks directory: opt out of requiring type annotations since these
# are standalone scripts not called by other parts of the codebase
[[tool.mypy.overrides]]
module = "benchmarks.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false

# Ignore missing stubs for external libraries used by benchmarks
[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "flask.*",
    "jieba.*",
    "pypinyin.*",
    "psutil.*",
    "bokeh.*",
]
ignore_missing_imports = true

# Skip bokeh entirely - it's a transitive dependency with Python 3.10+ syntax
[[tool.mypy.overrides]]
module = "bokeh.*"
follow_imports = "skip"

# Ignore missing imports for optional ML/audio dependencies
# These are only required when using audioshoe features
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "numpy.*",
    "scipy.*",
    "librosa.*",
    "pydub.*",
    "transformers.*",
    "datasets.*",
    "TTS.*",
    "qwen_tts.*",
    "whisper.*",
]
ignore_missing_imports = true

# Audioshoe sample/driver scripts - relaxed typing for demo code
[[tool.mypy.overrides]]
module = [
    "audioshoe.driver",
    "audioshoe.driver_long",
    "audioshoe.sample_driver",
    "audioshoe.split_file",
]
disallow_untyped_defs = false
warn_return_any = false

# Trakaido utils - interactive CLI tools, skip type checking
[[tool.mypy.overrides]]
module = "wordfreq.trakaido.*"
ignore_errors = true

# Files with complex JSON/dict type inference issues, obsolete API calls,
# missing module exports, or deep structural issues that would require
# significant refactoring - ignore all errors for now
[[tool.mypy.overrides]]
module = [
    "benchmarks.lib.exemplars.tasks.wordfreq_translation_exemplar",
    "benchmarks.lib.exemplars.tasks.lithuanian_sentence_exemplar",
    "benchmarks.lib.exemplars.tasks.zebra_puzzle_exemplar",
    "benchmarks.lib.exemplars.tasks.wars_of_roses_exemplar",
    "benchmarks.lib.exemplars.tasks.poker_scorer_exemplar",
    "benchmarks.lib.exemplars.tasks.poetry_exemplar",
    "benchmarks.lib.exemplars.tasks.granite_structured_def_exemplar",
    "benchmarks.lib.exemplars.tasks.granite_definition_exemplar",
    "benchmarks.lib.exemplars.tasks.firefighter_dialogue_exemplar",
    "benchmarks.scripts.model_comparison",
    "benchmarks.verbalator.server",
    "benchmarks.server.routes.verbalator",
    "benchmarks.lib.generators.pinyin_letter_count_generator",
    "benchmarks.lib.generators.english_to_ipa_generator",
    "benchmarks.lib.generators.part_of_speech_generator",
    "benchmarks.lib.exemplars.base",
    "benchmarks.datastore.test_benchmarks",
    "benchmarks.lib.utils.base_runner",
    "benchmarks.lib.utils.base_generator",
    "benchmarks.lib.runners.geography_runner",
    "benchmarks.lib.generators.lemma_generator",
    # One-off utility scripts with dynamic path manipulation
    "wordfreq.trakaido.utils.add_english_verb_conjugations",
    # Complex benchmark runner with many dynamic patterns
    "benchmarks.run_quals",
    "benchmarks.scripts.run_all_quals",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
